---
- name: Validate and reload nginx
  ansible.builtin.command: nginx -t
  changed_when: false
  notify: Reload nginx service
  # nginx -t validates the FULL config (SRC-Nginx server block + all
  # app-location includes) before any reload — a broken render must never
  # take the workspace's other web apps down.

- name: Reload nginx service
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Restart php-fpm
  ansible.builtin.service:
    name: "{{ php_fpm_service }}"
    state: restarted
